[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-manager"
version = "0.1.0"
description = "A small cross-platform WiFi scanner and connection manager CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OrenA" }]
keywords = ["wifi", "network", "nmcli", "netsh", "airport", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
wifi = "wifi_manager.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["wifi_manager", "wifi_manager.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
